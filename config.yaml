# All numbers here are ASSUMPTIONS. State them in the README.
costs:
  review_cost_usd: 5.00        # assumption: cost of one analyst review
  false_decline_cost_usd: 10.00 # assumption: cost of blocking a legitimate customer
  # missed fraud costs the transaction amount itself

review:
  daily_review_budget: 200     # assumption: cases analysts can review per day

split:
  # Our choice, not an assumption: data runs 2019-01-01 to 2020-12-31.
  # Each date is the first day NOT in that set (exclusive end).
  # train = Jan 2019 - Jun 2020 (18 months), validation = Jul - Sep 2020, test = Oct - Dec 2020
  train_end: "2020-07-01"
  validation_end: "2020-10-01"

lightgbm:
  # Model settings: our choices, tuned only on validation months.
  learning_rate: 0.05
  max_trees: 3000              # upper limit; early stopping picks the actual number
  early_stopping_rounds: 100   # stop after this many trees with no validation PR-AUC gain
  scale_pos_weight: 13.0       # fraud rows count 13x; about sqrt(173), the legit-to-fraud ratio in train.
                               # Beat no weighting (1.0) and full balancing (173) on validation PR-AUC.

evaluation:
  review_share: 0.01           # assumption: share of transactions analysts could review, used for "recall at top 1%"
