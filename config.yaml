# All numbers here are ASSUMPTIONS. State them in the README.
costs:
  review_cost_usd: 5.00        # assumption: cost of one analyst review (a few minutes of analyst time)
  false_decline_cost_usd: 10.00 # assumption: cost of blocking a legitimate customer (lost sale, support call, annoyance)
  # Also assumed (see src/costs.py): an approved fraud loses its whole amount; an analyst
  # always catches fraud on review and always approves a legitimate transaction; blocking a
  # fraud costs nothing.

review:
  daily_review_budget: 30      # assumption: cases analysts can review per day. About 1% of the
                               # ~3,000 transactions a day in the test months, and ~3x the ~10 frauds
                               # a day, so analysts can't review every suspicious case and must choose.

split:
  # Our choice, not an assumption: data runs 2019-01-01 to 2020-12-31.
  # Each date is the first day NOT in that set (exclusive end).
  # train       = Jan 2019 - Jun 2020 (18 months): fit the models
  # tuning      = Jul - Aug 2020: choose scale_pos_weight and when to stop adding trees
  # calibration = Sep 2020: calibrate probabilities (step 7), nothing else
  # test        = Oct - Dec 2020: final evaluation only
  train_end: "2020-07-01"
  tuning_end: "2020-09-01"
  calibration_end: "2020-10-01"

lightgbm:
  # Model settings: our choices, tuned only on the tuning months.
  learning_rate: 0.05
  max_trees: 3000              # upper limit; early stopping picks the actual number
  early_stopping_rounds: 100   # stop after this many trees with no tuning PR-AUC gain
  # How many times a fraud row counts. Each is tried; the best tuning PR-AUC wins.
  # 1 = no weighting, 13 = about sqrt(173), 173 = the legit-to-fraud ratio in train (fully balanced).
  scale_pos_weight_candidates: [1, 13, 173]

evaluation:
  review_share: 0.01           # assumption: share of transactions analysts could review, used for "recall at top 1%"
  budget_curve: [5, 10, 15, 20, 30, 45, 60]  # daily review budgets compared in the policy budget curve
  review_cost_multipliers: [0.5, 2.0]        # sensitivity check: rerun with the review cost halved and doubled
